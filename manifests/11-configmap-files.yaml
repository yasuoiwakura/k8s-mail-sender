# Generated by scripts/generate.py from config/domains.yaml.
# Do not edit manually; change config/domains.yaml and regenerate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-files
  namespace: mail
data:
  postfix-main.cf: |
    # Envelope sender domain allowlist.
    dms_smtpd_sender_restrictions = check_sender_access texthash:/tmp/docker-mailserver/sender_domains, reject

    # Rewrite the envelope sender to a reachable bounce address.
    sender_canonical_maps = pcre:/tmp/docker-mailserver/sender_canonical.pcre
    sender_canonical_classes = envelope_sender
  postfix-master.cf: |
    # Apply the From: header check on the submission ports without
    # losing the DMS privacy header filter.
    sender-cleanup/unix/header_checks=pcre:/etc/postfix/maps/sender_header_filter.pcre, pcre:/tmp/docker-mailserver/from_domains.pcre
  sender_domains: |
    example.org OK
    example.net OK
    example.com OK
    example.info OK
    <> OK
  from_domains.pcre: |
    if /^From:/
    !/^From:.*@(?:example\.org|example\.net|example\.com|example\.info)[ \t]*>?[ \t]*$/i REJECT 5.7.1 Sender domain not allowed
    endif
  sender_canonical.pcre: |
    /^(?!bounces@example\.org$).+@.+/i bounces@example.org
  domains.txt: |
    example.org
    example.net
    example.com
    example.info
