apiVersion: v1
kind: Service
metadata:
  name: dms
  namespace: mail
  labels:
    app.kubernetes.io/name: dms
    app.kubernetes.io/component: mailserver
    app.kubernetes.io/part-of: mail
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: dms
  ports:
    # SMTP submission, implicit TLS.
    - name: submissions
      port: 465
      targetPort: submissions
      protocol: TCP
    # SMTP submission, STARTTLS.
    - name: submission
      port: 587
      targetPort: submission
      protocol: TCP
